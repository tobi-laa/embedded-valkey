# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - README.adoc
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-26 ]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set OpenSSL path on macOS
        if: runner.os == 'macOS'
        run: |
          export DYLD_FALLBACK_FRAMEWORK_PATH=$(brew --prefix openssl@3)/lib:$DYLD_FALLBACK_FRAMEWORK_PATH
          echo "DYLD_FALLBACK_FRAMEWORK_PATH=$(brew --prefix openssl@3)/lib:\$DYLD_FALLBACK_FRAMEWORK_PATH" >> $GITHUB_ENV
          echo "DYLD_LIBRARY_PATH=$(brew --prefix openssl@3)/lib:\$DYLD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "DYLD_FRAMEWORK_PATH=$(brew --prefix openssl@3)/lib:\$DYLD_FRAMEWORK_PATH" >> $GITHUB_ENV
      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build with Maven
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B package --file pom.xml
